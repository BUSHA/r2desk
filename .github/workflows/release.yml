name: Build release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  mac:
    name: Release / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Check version and runner architecture
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' scripts/Info.plist)
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Release tag must match scripts/Info.plist: v$version" >&2
            exit 1
          fi
          if [ "$(uname -m)" != "$EXPECTED_ARCH" ]; then
            echo "Runner CPU does not match $EXPECTED_ARCH" >&2
            exit 1
          fi
      - name: Check scripts and metadata
        run: |
          bash -n scripts/build-app.sh scripts/package-release.sh scripts/test.sh scripts/swift-env.sh
          plutil -lint scripts/Info.plist
      - name: Run core checks
        run: bash scripts/test.sh
      - name: Build app
        run: bash scripts/build-app.sh
      - name: Package and verify app
        run: bash scripts/package-release.sh
      - name: Attach app and checksum to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" dist/R2-Desk-*-"$EXPECTED_ARCH".zip \
            dist/R2-Desk-*-"$EXPECTED_ARCH".zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber
